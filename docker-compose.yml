services:
  api:
    build:
      context: .
      dockerfile: src/Gloria.Commission.Api/Dockerfile
    ports:
      - "5199:8080"
    environment:
      ConnectionStrings__Default: "Data Source=/app/data/gloria-commission.db"
      Cors__Origins__0: "http://localhost:5173"
      # Zamanlanmis aktarim: kaynak sistemler ekstreyi inbox klasorune birakir.
      ImportWatcher__Enabled: "true"
      ImportWatcher__InboxPath: "/app/data/inbox"
      ImportWatcher__ProcessedPath: "/app/data/processed"
      ImportWatcher__FailedPath: "/app/data/failed"
      ImportWatcher__Interval: "00:01:00"
      ImportWatcher__InitialDelay: "00:00:10"
    volumes:
      # SQLite dosyasi konteyner disinda kalir; yeniden olusturmada veri kaybolmaz.
      - api-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 25s

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: "http://localhost:5199"
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
