server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tek sayfa uygulama: bilinmeyen yollar index.html'e duser.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
